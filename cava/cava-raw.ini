# Second cava config, separate from ./config (the terminal/ncurses one).
# Used by the desktop audio visualizer widget (quickshell/desktop/Widgets/DesktopAudioVisualizer.qml)
# to read bar-height data instead of drawing to a terminal. Not wired into set-theme.sh's
# `pkill -USR1 cava` reload — that only targets the ncurses instance, this one is started and
# stopped by the widget itself based on desktopAudioVisualizerEnabled.
#
# Manual test: `cava -p cava/cava-raw.ini | head -5` should print lines of N ';'-separated
# integers (0-100), one per frame.
#
# The widget actually launches a copy of this file with `bars` substituted from the
# desktopAudioVisualizerBars setting (written to ~/.cache/quickshell/), so changing this
# repo copy's bar count only affects a manual `cava -p` test, not the live widget.

[general]
framerate = 60
bars = 24

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 77
monstercat = 1
